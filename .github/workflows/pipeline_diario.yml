name: 🏛️ Pipeline Diario — Senado Nacional (manual)

# NOTA: este workflow ya NO corre en schedule automático — quedó consolidado
# dentro de monitor_diario.yml (08:10 ART), que ahora también hace
# `cargar_db.py` y commitea data/*.csv. Correr pipeline.py en dos workflows
# separados generaba doble commit/push casi en simultáneo y riesgo de
# conflictos de git. Este workflow queda solo para forzar una recarga manual
# puntual (ej. si el run diario falló) — no se dispara solo.
on:
  workflow_dispatch:
    inputs:
      force_reload:
        description: 'Forzar recarga aunque no haya cambios'
        required: false
        default: 'false'

jobs:
  pipeline:
    name: Scraper + Carga DB
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: pip install -r requirements.txt

      - name: 🏛️ Correr pipeline (scraper + CSVs)
        run: python pipeline.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 📦 Cargar CSVs a PostgreSQL
        run: python cargar_db.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 💾 Commitear CSVs al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/*.csv
          git diff --cached --quiet || git commit -m "🤖 datos actualizados $(date '+%Y-%m-%d')"
          git push

      - name: 💾 Guardar CSVs como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: senado-data-${{ github.run_number }}
          path: data/*.csv
          retention-days: 30

      - name: 📢 Notificar resultado
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Pipeline completado exitosamente — $(date '+%d/%m/%Y %H:%M')"
          else
            echo "❌ Pipeline falló — revisar logs"
          fi
